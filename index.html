<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24時間スケジュール時計</title>
<meta name="theme-color" content="#18242c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9edf0;--panel:#f7f9fa;--ink:#18242c;--sub:#5d6c76;--line:#c9d2d8;--hand:#c8102e;--now:#fff3c4;--field:#ffffff;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --num:"Barlow Semi Condensed","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141c22;--panel:#1d2830;--ink:#e8eef2;--sub:#93a3ad;--line:#33424c;--hand:#ff5a6e;--now:#3a3520;--field:#141c22;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);line-height:1.5}
main{max-width:980px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:24px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){main{grid-template-columns:1fr}}
.dial{width:100%;max-width:520px;margin:0 auto;display:block}
.seg{transition:opacity .3s}
.tick{stroke:var(--line);stroke-width:1.5}
.hlabel{font-family:var(--num);font-size:15px;fill:var(--sub);text-anchor:middle;dominant-baseline:central}
.hand{stroke:var(--hand);stroke-width:3.5;stroke-linecap:round}
.c-time{font-family:var(--num);font-size:30px;font-weight:600;fill:var(--sub);text-anchor:middle;font-variant-numeric:tabular-nums}
.c-act{font-size:30px;font-weight:700;fill:var(--ink);text-anchor:middle}
.c-rem{font-size:15px;fill:var(--ink);text-anchor:middle}
.c-next{font-size:13px;fill:var(--sub);text-anchor:middle}
aside{background:var(--panel);border-radius:14px;padding:16px}
h1{font-size:17px;margin:0 0 12px}
ol{list-style:none;margin:0;padding:0}
#list li{display:grid;grid-template-columns:auto 12px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;font-size:14.5px}
#list li + li{border-top:1px solid var(--line)}
#list li.now{background:var(--now);font-weight:700;border-top-color:transparent}
#list li.now + li{border-top-color:transparent}
.t{font-family:var(--num);font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
li.now .t{color:var(--ink)}
.dot{width:12px;height:12px;border-radius:3px}
.d{font-family:var(--num);color:var(--sub);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button,.filebtn{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--hand);outline-offset:2px}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.msg{font-size:12.5px;color:var(--sub);margin:10px 0 0;min-height:1.2em}
#editRows li{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
#editRows li:first-child{border-top:0}
#editRows .name{grid-column:1/3}
#editRows .times{grid-column:1/-1;display:flex;gap:6px;align-items:center;color:var(--sub)}
#editRows .del{grid-column:3;grid-row:1}
input[type=text],input[type=time]{font:inherit;font-size:16px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);min-width:0;width:100%}
input[type=time]{width:auto;font-family:var(--num)}
#editRows .cat{width:9em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <svg class="dial" viewBox="0 0 440 440" role="img" aria-label="24時間スケジュール時計">
    <g id="segs"></g><g id="ticks"></g>
    <line id="hand" class="hand" x1="220" y1="98" x2="220" y2="22"/>
    <text id="cTime" class="c-time" x="220" y="165"></text>
    <text id="cAct" class="c-act" x="220" y="222"></text>
    <text id="cRem" class="c-rem" x="220" y="254"></text>
    <text id="cNext" class="c-next" x="220" y="284"></text>
  </svg>
  <aside>
    <section id="viewPane">
      <h1>今日の予定</h1>
      <ol id="list"></ol>
      <div class="tools">
        <button id="edit" type="button" class="primary">予定を編集</button>
        <label class="filebtn">Excelから読み込む<input type="file" id="file" accept=".xlsx"></label>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </section>
    <section id="editPane" hidden>
      <h1>予定を編集</h1>
      <ol id="editRows"></ol>
      <datalist id="cats"></datalist>
      <div class="tools">
        <button id="add" type="button">予定を追加</button>
        <button id="save" type="button" class="primary">保存</button>
        <button id="cancel" type="button">キャンセル</button>
        <button id="reset" type="button">初期の予定に戻す</button>
      </div>
      <p class="msg" id="emsg" role="status"></p>
    </section>
  </aside>
</main>
<script>
const DEFAULT=[["睡眠","睡眠",1410,390],["朝食・身支度","食事",390,450],["移動","移動",450,510],["研究","研究",510,720],["昼食","食事",720,780],["研究","研究",780,1080],["運動","運動",1080,1140],["夕食","食事",1140,1200],["風呂","その他",1200,1230],["英語","英語",1230,1290],["自由時間","自由時間",1290,1410]];
const PAL=["#3d5a80","#2a9d8f","#e9a23b","#8e6fb5","#7a8b99","#d65f5f","#5fa8d3","#b5895a","#6b9e4d","#c46a9a"];
const KEY="schedule24h";
let items=DEFAULT.map(x=>[...x]), curIdx=-2;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.items&&s.items.length)items=s.items;}catch(e){}
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const el=(tag,props)=>Object.assign(document.createElement(tag),props||{});
const dur=it=>((it[3]-it[2]+1440)%1440)||1440;
const hm=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
const hm2=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const toMin=v=>{const p=v.split(":");return p.length<2?NaN:(+p[0])*60+(+p[1]);};
const pt=(min,r)=>{const a=min/1440*2*Math.PI;return [220+r*Math.sin(a),220-r*Math.cos(a)];};
function store(){try{localStorage.setItem(KEY,JSON.stringify({items}));}catch(e){}}
function arc(s,d,ro,ri){
  if(d>=1440) return arc(s,720,ro,ri)+arc(s+720,720,ro,ri);
  const e=s+d,[x1,y1]=pt(s,ro),[x2,y2]=pt(e,ro),[x3,y3]=pt(e,ri),[x4,y4]=pt(s,ri),l=d>720?1:0;
  return `M${x1} ${y1}A${ro} ${ro} 0 ${l} 1 ${x2} ${y2}L${x3} ${y3}A${ri} ${ri} 0 ${l} 0 ${x4} ${y4}Z`;
}
function colorMap(){const m={};items.forEach(it=>{const c=it[1]||it[0];if(!(c in m))m[c]=PAL[Object.keys(m).length%PAL.length];});return m;}
function drawTicks(){
  const g=$("ticks");
  for(let h=0;h<24;h++){
    const [x1,y1]=pt(h*60,h%3?118:112),[x2,y2]=pt(h*60,124),l=document.createElementNS(NS,"line");
    l.setAttribute("class","tick");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);g.appendChild(l);
    if(h%3===0){const [x,y]=pt(h*60,206),t=document.createElementNS(NS,"text");t.setAttribute("class","hlabel");t.setAttribute("x",x);t.setAttribute("y",y);t.textContent=h;g.appendChild(t);}
  }
}
function render(idx){
  const cm=colorMap(),g=$("segs");g.innerHTML="";
  items.forEach((it,i)=>{
    const p=document.createElementNS(NS,"path"),on=i===idx;
    p.setAttribute("class","seg");p.setAttribute("d",arc(it[2],dur(it),on?194:186,on?124:130));
    p.setAttribute("fill",cm[it[1]||it[0]]);p.setAttribute("opacity",on?1:.5);
    p.setAttribute("stroke","var(--bg)");p.setAttribute("stroke-width",2);
    const t=document.createElementNS(NS,"title");t.textContent=`${it[0]} ${hm(it[2])}–${hm(it[3])}`;p.appendChild(t);g.appendChild(p);
  });
  const ol=$("list");ol.innerHTML="";
  items.forEach((it,i)=>{
    const li=el("li");if(i===idx){li.className="now";li.setAttribute("aria-current","true");}
    const dot=el("span",{className:"dot"});dot.style.background=cm[it[1]||it[0]];
    li.append(el("span",{className:"t",textContent:hm(it[2])+"–"+hm(it[3])}),dot,el("span",{textContent:it[0]}),
      el("span",{className:"d",textContent:(dur(it)/60).toFixed(1).replace(/\.0$/,"")+"h"}));
    ol.appendChild(li);
  });
}
function tick(){
  const n=new Date(),sec=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),min=sec/60;
  const idx=items.findIndex(it=>((min-it[2]+1440)%1440)<dur(it));
  if(idx!==curIdx){curIdx=idx;render(idx);}
  $("hand").setAttribute("transform",`rotate(${sec/86400*360} 220 220)`);
  $("cTime").textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map((v,i)=>i?String(v).padStart(2,"0"):v).join(":");
  if(idx<0){$("cAct").textContent="予定なし";$("cAct").style.fontSize="30px";$("cRem").textContent="";$("cNext").textContent="";return;}
  const it=items[idx],rem=Math.ceil(dur(it)-((min-it[2]+1440)%1440)),h=Math.floor(rem/60),m=rem%60;
  $("cAct").textContent=it[0];$("cAct").style.fontSize=it[0].length>7?"21px":"30px";
  $("cRem").textContent="あと "+(h?h+"時間":"")+m+"分（"+hm(it[3])+" まで）";
  const nx=items.find(x=>x[2]===it[3]%1440&&x!==it);
  $("cNext").textContent=nx?"次は "+nx[0]:"";
}
function refresh(){curIdx=-2;tick();}

/* ---- 編集 ---- */
function addRow(it){
  const li=el("li");
  const name=el("input",{type:"text",className:"name",value:it[0],placeholder:"行動（例：研究）"});name.setAttribute("aria-label","行動");
  const del=el("button",{type:"button",className:"del",textContent:"削除"});
  const cat=el("input",{type:"text",className:"cat",value:it[1],placeholder:"カテゴリ"});cat.setAttribute("list","cats");cat.setAttribute("aria-label","カテゴリ");
  const s=el("input",{type:"time",className:"s",value:hm2(it[2])});s.setAttribute("aria-label","開始");
  const e=el("input",{type:"time",className:"e",value:hm2(it[3])});e.setAttribute("aria-label","終了");
  const times=el("div",{className:"times"});times.append(s,"〜",e,cat);
  del.addEventListener("click",()=>{li.remove();sumMsg();});
  li.append(name,del,times);$("editRows").appendChild(li);
  return name;
}
function readRows(){
  return [...$("editRows").children].map(li=>[li.querySelector(".name").value.trim(),li.querySelector(".cat").value.trim(),
    toMin(li.querySelector(".s").value),toMin(li.querySelector(".e").value)]);
}
function sumMsg(){
  const rows=readRows().filter(r=>!isNaN(r[2])&&!isNaN(r[3]));
  const tot=rows.reduce((a,r)=>a+dur(r),0),diff=tot-1440,f=m=>(Math.abs(m)/60).toFixed(1).replace(/\.0$/,"")+"時間";
  $("emsg").textContent="合計 "+f(tot)+(diff===0?"（ちょうど24時間）":diff<0?"（"+f(diff)+" 未入力）":"（"+f(diff)+" 超過。重なりを確認）");
}
function openEdit(){
  $("editRows").innerHTML="";items.forEach(addRow);
  const dl=$("cats");dl.innerHTML="";[...new Set(items.map(i=>i[1]).filter(Boolean))].forEach(c=>dl.appendChild(el("option",{value:c})));
  $("viewPane").hidden=true;$("editPane").hidden=false;sumMsg();
}
function closeEdit(msg){$("editPane").hidden=true;$("viewPane").hidden=false;$("msg").textContent=msg||"";refresh();}
$("edit").addEventListener("click",openEdit);
$("editRows").addEventListener("input",sumMsg);
$("add").addEventListener("click",()=>{
  const rows=readRows(),last=rows[rows.length-1],s=last&&!isNaN(last[3])?last[3]:0;
  addRow(["","",s,(s+60)%1440]).focus();sumMsg();
});
$("save").addEventListener("click",()=>{
  const rows=readRows();
  if(!rows.length){$("emsg").textContent="予定を1件以上入力してください";return;}
  const bad=rows.findIndex(r=>!r[0]||isNaN(r[2])||isNaN(r[3]));
  if(bad>=0){$("emsg").textContent=(bad+1)+"行目：行動名と開始・終了時刻を入力してください";return;}
  items=rows.sort((a,b)=>a[2]-b[2]);store();closeEdit("保存しました");
});
$("cancel").addEventListener("click",()=>closeEdit(""));
$("reset").addEventListener("click",()=>{
  if(!confirm("編集内容を破棄して初期の予定に戻しますか？"))return;
  items=DEFAULT.map(x=>[...x]);try{localStorage.removeItem(KEY);}catch(e){}closeEdit("初期の予定に戻しました");
});

/* ---- Excel読み込み（オンライン時のみ） ---- */
function loadXLSX(){
  return window.XLSX?Promise.resolve():new Promise((ok,ng)=>{
    const s=el("script",{src:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"});
    s.onload=ok;s.onerror=()=>ng(new Error("オフラインのためExcel読み込みは使えません"));document.head.appendChild(s);});
}
function parse(buf){
  const wb=XLSX.read(buf,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true});
  const h=rows.findIndex(r=>r&&r[0]==="行動");if(h<0)throw new Error("「行動」の見出し行が見つかりません");
  const out=[],f=v=>Math.round((v%1)*1440)%1440;
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];if(r[0]==="未入力"||r[0]==="合計")break;
    if(!r[0]||typeof r[2]!=="number"||typeof r[3]!=="number")continue;
    out.push([String(r[0]),r[1]?String(r[1]):"",f(r[2]),f(r[3])]);
  }
  if(!out.length)throw new Error("予定が1件も読み取れませんでした");
  return out;
}
$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{await loadXLSX();items=parse(new Uint8Array(await f.arrayBuffer()));store();$("msg").textContent=items.length+"件の予定を読み込みました";}
  catch(err){$("msg").textContent="読み込めませんでした：".concat(err.message);}
  e.target.value="";refresh();
});

drawTicks();tick();setInterval(tick,1000);
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
